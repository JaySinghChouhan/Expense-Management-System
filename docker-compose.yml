services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: ./backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/expense_management
      JWT_SECRET: change_this_docker_secret_before_use_please
      CLIENT_URL: http://localhost:5173
    ports: ["5000:5000"]
    depends_on: [mongo]
volumes:
  mongo_data:
