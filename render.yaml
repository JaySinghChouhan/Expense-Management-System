services:
  - type: web
    name: expense-management-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: SEED_DEMO
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
